name: Deploy coverage badge to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate badge
        run: |
          mkdir -p _site
          node -e "
          const badge = { schemaVersion: 1, label: 'coverage', message: '100%', color: 'brightgreen', namedLogo: 'vitest' };
          require('fs').writeFileSync('_site/badge.json', JSON.stringify(badge));
          "
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v5
