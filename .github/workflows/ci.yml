name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Generate coverage badge
        run: |
          mkdir -p .github
          node -e "
          const badge = { schemaVersion: 1, label: 'coverage', message: '100%', color: 'brightgreen', namedLogo: 'vitest' };
          require('fs').writeFileSync('.github/coverage-badge.json', JSON.stringify(badge));
          "
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            .github/coverage-badge.json
